[package]
name = "stellar_pact"
version = "0.1.0"
edition = "2021"
authors = ["StellarPact Developer"]
description = "Micro-Escrow Smart Contract for Soroban (Stellar Network)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# -----------------------------------------------------------------------------
# CẤU HÌNH TỐI ƯU HÓA SIZE FILE .WASM CHO DEPLOYMENT LÊN SOROBAN MAINNET
# -----------------------------------------------------------------------------
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.release.build-override]
opt-level = "z"
